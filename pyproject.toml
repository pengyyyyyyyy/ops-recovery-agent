[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ops-recovery-agent"
version = "0.1.0"
description = "Evidence-driven incident diagnosis with durable execution, approval-bound repairs, MCP, and reproducible evaluations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "smolagents[openai]>=1.26,<2",
  "mcp>=1.20,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "typer>=0.16,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
datasets = ["huggingface-hub>=0.34,<2", "pyarrow>=20", "pandas>=2.2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1.2"]

[project.scripts]
ops = "ops_recovery.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_recovery"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/artifacts", "/.github", "/README.md", "/pyproject.toml", "/requirements.lock.txt", "/LICENSE", "/NOTICE", "/THIRD_PARTY.md", "/CONTRIBUTING.md", "/.env.example", "/.gitignore", "/.gitattributes", "/Dockerfile", "/.dockerignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real local processes or MCP, without a paid model", "live: explicitly enabled paid model evaluation"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
